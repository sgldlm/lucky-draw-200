<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100赛地 · 购物赢大奖 —官方活动平台</title>
    <!-- PWA：可安装到手机桌面 / 电脑，支持离线打开 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF9F1C">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="赢大奖">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // 旧版浅色配色（页面现使用下方 <style> 中的深色舞台 + 主色发光设计）
                        momo: {
                            accent: 'var(--accent)', // 场次主色：200赛地专场 MoMo 黄，100赛地专场 橙色
                            ink: '#111111',          // 主文字 / 黑色按钮
                            gray: '#5F5F5F',         // 次要文字
                            line: '#E3E3E3',         // 分隔线 / 进度条底
                            bg: '#F4F4F4',           // 页面底色
                            locked: '#3A3A3A',       // 已锁定格子（深灰）
                            red: '#C62828'           // 危险操作
                        }
                    },
                    fontFamily: {
                        sans: ['system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* ===== 两个专场的配色（户外大屏：深色舞台底 + 高饱和主色发光） =====
           --accent 主色；--accent-hi 高光色；--accent-lo 深色端；--glow 光晕 */
        :root {
            --accent: #FFCC00; --accent-hi: #FFF06A; --accent-lo: #FF8A00;
            --glow: rgba(255, 204, 0, 0.55); --glow-soft: rgba(255, 204, 0, 0.18);
            --stage: #07070C;
        }
        body[data-round="100"] {
            --accent: #FF9F1C; --accent-hi: #FFD36B; --accent-lo: #FF3D00;
            --glow: rgba(255, 110, 20, 0.6); --glow-soft: rgba(255, 110, 20, 0.2);
        }
        body[data-round="50"] {
            --accent: #2BE07A; --accent-hi: #B2FFD0; --accent-lo: #06934A;
            --glow: rgba(43, 224, 122, 0.55); --glow-soft: rgba(43, 224, 122, 0.18);
        }

        /* 页面底：深色舞台 + 主色柔光 */
        body { background-color: var(--stage); color: #fff; }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background:
                radial-gradient(ellipse 70% 45% at 50% 0%, var(--glow-soft), transparent 70%),
                radial-gradient(ellipse 45% 40% at 0% 100%, var(--glow-soft), transparent 70%),
                radial-gradient(ellipse 45% 40% at 100% 100%, var(--glow-soft), transparent 70%),
                radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1.2px) 0 0 / 22px 22px,
                var(--stage);
        }

        /* 顶栏：主色渐变 + 舞台放射光 */
        .fx-header {
            position: relative; overflow: hidden;
            background: linear-gradient(115deg, var(--accent-hi) 0%, var(--accent) 45%, var(--accent-lo) 100%);
            box-shadow: 0 10px 50px var(--glow);
        }
        .fx-header::before {
            content: ""; position: absolute; inset: -50% -10% 0; pointer-events: none;
            background: repeating-conic-gradient(from 0deg at 50% 100%, rgba(255, 255, 255, 0.22) 0deg 5deg, transparent 5deg 12deg);
            -webkit-mask-image: radial-gradient(ellipse 60% 90% at 50% 100%, #000 30%, transparent 75%);
                    mask-image: radial-gradient(ellipse 60% 90% at 50% 100%, #000 30%, transparent 75%);
        }
        .fx-header > * { position: relative; }

        /* 两侧大插画：礼物+赛地金币（左）、奖杯（右）
           从顶栏一直延伸到数据卡片的左上角 / 右上角，叠在卡片上层，形成跃出画面的气势；
           宽度上限保证不遮挡"总名额""剩余名额"的数字 */
        .hero { position: relative; }
        .hero > .deco {
            position: absolute; z-index: 5; pointer-events: none; user-select: none;
            top: clamp(4px, 1vh, 16px);
            bottom: 26%;
            width: calc(20vw - 90px);
            object-fit: contain;
            filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 26px var(--glow));
            animation: fx-float 4s ease-in-out infinite;
        }
        /* 礼品图：底边对齐到数据卡片约 80% 高度处（靠下摆放） */
        .hero > .deco-left {
            left: 1.5vw; top: auto; bottom: 9%; height: auto;
            max-height: calc(91% - clamp(4px, 1vh, 16px)); /* 矮屏时不超出顶部 */
            object-position: left bottom;
        }
        .hero > .deco-right { right: 1.5vw; object-position: right center; animation-delay: -2s; scale: 0.9; transform-origin: right top; } /* 奖杯缩小 10% */
        @keyframes fx-float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
        @media (max-width: 900px) { .hero > .deco { display: none; } }

        /* 全屏彩带：加纳国旗色（红、金、绿）纸片缓缓飘落，位于内容后方 */
        #confetti { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        #confetti i {
            position: absolute; top: -6vh; display: block; border-radius: 2px; opacity: 0.75;
            animation: fx-fall linear infinite;
        }
        @keyframes fx-fall {
            0% { transform: translate3d(0, 0, 0) rotate(0deg); }
            100% { transform: translate3d(var(--drift), 112vh, 0) rotate(var(--spin)); }
        }
        .fx-title { color: #111; text-shadow: 0 2px 0 rgba(255, 255, 255, 0.5), 0 6px 18px rgba(0, 0, 0, 0.18); letter-spacing: 0.02em; }

        /* 专场切换 */
        .round-tab {
            border-radius: 9999px; font-weight: 800; color: #111;
            border: 2px solid #111; background: rgba(255, 255, 255, 0.25);
            transition: background-color .2s, color .2s, box-shadow .2s;
        }
        .round-tab:hover { background: rgba(255, 255, 255, 0.45); }
        .round-tab.active { background: #111; color: var(--accent); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); }

        /* 数据卡：深色发光玻璃 */
        .fx-card {
            background: linear-gradient(180deg, rgba(34, 34, 46, 0.94), rgba(14, 14, 20, 0.96));
            border: 1px solid var(--accent);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04) inset, 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 40px var(--glow-soft);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        }
        .fx-stat-label { color: #B9B9CC; letter-spacing: 0.08em; }
        .fx-stat-num { color: #fff; text-shadow: 0 0 18px rgba(255, 255, 255, 0.25); }
        .fx-stat-num.hot {
            background: linear-gradient(180deg, var(--accent-hi), var(--accent) 60%, var(--accent-lo));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-shadow: none; filter: drop-shadow(0 0 12px var(--glow));
        }
        .fx-divide > * + * { border-left: 1px solid rgba(255, 255, 255, 0.12); }
        .fx-track { background: rgba(255, 255, 255, 0.1); box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6); }
        .fx-fill {
            background:
                repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.28) 0 10px, transparent 10px 22px),
                linear-gradient(90deg, var(--accent-lo), var(--accent), var(--accent-hi));
            background-size: 44px 100%, 100% 100%;
            box-shadow: 0 0 14px var(--glow);
            animation: fx-flow 1.2s linear infinite;
        }
        @keyframes fx-flow { to { background-position: 44px 0, 0 0; } }
        .fx-muted { color: #A6A6B8; }
        .fx-accent { color: var(--accent); }

        /* 图例 */
        .fx-legend-title { color: #fff; }
        .fx-legend-items { color: #D4D4E0; }
        .fx-btn-all { background: linear-gradient(180deg, var(--accent-hi), var(--accent)); color: #111; font-weight: 700; box-shadow: 0 0 14px var(--glow-soft); }
        .fx-btn-reset { border: 1px solid #FF6B6B; color: #FF8A8A; background: rgba(255, 80, 80, 0.08); }
        .fx-btn-reset:hover { background: #E53935; color: #fff; border-color: #E53935; }

        /* 图例行：左 = 每格说明，中 = 今日大奖，右 = 图例和按钮 */
        .legend-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px 24px; }
        .legend-row > :first-child { justify-self: start; }
        .legend-row > :last-child { justify-self: end; }
        @media (max-width: 1023px) {
            .legend-row { grid-template-columns: 1fr; }
            .legend-row > * { justify-self: start !important; }
        }

        /* 今日大奖：发光横幅 */
        .fx-prize {
            display: inline-flex; align-items: center; gap: 0.45em;
            padding: 0.18em 1em; border-radius: 9999px; line-height: 1.35;
            font-size: clamp(0.95rem, 2.4vh, 1.9rem); font-weight: 900; white-space: nowrap;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.02));
            border: 2px solid var(--accent);
            box-shadow: 0 0 22px var(--glow), inset 0 0 18px var(--glow-soft);
            animation: fx-prize-glow 2.2s ease-in-out infinite;
        }
        .fx-prize .prize-icon { color: var(--accent-hi); filter: drop-shadow(0 0 8px var(--glow)); }
        .fx-prize .prize-label { color: #fff; }
        .fx-prize .prize-value {
            background: linear-gradient(180deg, var(--accent-hi), var(--accent) 60%, var(--accent-lo));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 0 10px var(--glow));
        }
        @keyframes fx-prize-glow { 0%, 100% { box-shadow: 0 0 16px var(--glow), inset 0 0 14px var(--glow-soft); } 50% { box-shadow: 0 0 34px var(--glow), inset 0 0 22px var(--glow-soft); } }

        /* 顶部工具按钮：中英文切换 / 编辑（右侧小按钮，与专场按钮同一高度，位于奖杯左边） */
        .fx-header > .tools {
            position: absolute; z-index: 6; display: flex; gap: 6px; align-items: center;
            right: calc(21.5vw - 78px);
            bottom: clamp(30px, 5.4vh, 100px);
            /* 与专场按钮同高，保证小按钮在同一行垂直居中 */
            height: calc(clamp(0.95rem, 1.9vh, 1.35rem) * 1.5 + 2 * clamp(6px, 1vh, 12px) + 4px);
        }
        @media (max-width: 900px) { .fx-header > .tools { right: 12px; } }
        @media (max-width: 640px) {
            .fx-header > .tools { position: static; justify-content: center; margin: -22px 0 calc(clamp(24px, 4.5vh, 64px) + 12px); height: auto; }
        }
        .tool-btn {
            border-radius: 9999px; font-weight: 700; color: #111; line-height: 1.2;
            border: 1.5px dashed rgba(0, 0, 0, 0.5); background: rgba(255, 255, 255, 0.22);
            font-size: clamp(0.72rem, 1.25vh, 0.9rem); padding: 3px 10px;
        }
        .tool-btn:hover { background: rgba(255, 255, 255, 0.45); }
        .tool-btn.on { background: #111; color: var(--accent); border-style: solid; border-color: #111; }

        /* 编辑模式：可编辑文字显示虚线框 */
        body.editing [data-i18n] { outline: 2px dashed rgba(0, 200, 255, 0.9); outline-offset: 3px; cursor: text; border-radius: 4px; }
        body.editing [data-i18n]:hover { background: rgba(0, 200, 255, 0.18); }
        #editBar {
            position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 60;
            display: none; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 14px;
            background: rgba(10, 10, 16, 0.95); border: 1px solid rgba(0, 200, 255, 0.8); color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); font-size: 14px;
        }
        body.editing #editBar { display: flex; }
        #editBar button { padding: 6px 14px; border-radius: 9999px; font-weight: 700; }
        #editPop {
            position: fixed; z-index: 70; display: none; width: min(420px, 92vw); padding: 14px; border-radius: 14px;
            background: #14141C; border: 1px solid var(--accent); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7); color: #fff;
        }
        #editPop textarea {
            width: 100%; min-height: 70px; padding: 8px 10px; border-radius: 8px; resize: vertical;
            background: #0B0B12; color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); font-size: 16px; outline: none;
        }
        #editPop textarea:focus { border-color: var(--accent); }
        #editPop .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; }
        #editPop button { padding: 6px 14px; border-radius: 9999px; font-weight: 700; font-size: 14px; }
        .btn-primary { background: var(--accent); color: #111; }
        .btn-ghost { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .btn-warn { background: rgba(255, 80, 80, 0.15); color: #FF8A8A; }

        /* 格子：立体按钮质感 */
        .cell-available {
            background: linear-gradient(160deg, var(--accent-hi) 0%, var(--accent) 50%, var(--accent-lo) 100%);
            color: #111;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), inset 0 -2px 0 rgba(0, 0, 0, 0.22);
        }
        .cell-available:hover {
            background: #fff; color: #111; position: relative; z-index: 2;
            transform: scale(1.18); box-shadow: 0 0 18px var(--glow), 0 0 0 2px var(--accent);
        }
        .cell-locked {
            background: linear-gradient(160deg, #474755 0%, #2A2A34 60%, #1E1E26 100%);
            color: rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 -2px 0 rgba(0, 0, 0, 0.45);
        }
        .swatch-available { background: linear-gradient(160deg, var(--accent-hi), var(--accent) 50%, var(--accent-lo)); }
        .swatch-locked { background: linear-gradient(160deg, #474755, #1E1E26); color: #fff; }

        /* 开始抽奖：纯橙色按钮；500格全部锁定后外圈呼吸闪光 */
        .fx-draw {
            color: #111; font-weight: 900; letter-spacing: 0.35em; text-indent: 0.35em;
            background: #FF8A00;
            box-shadow: 0 0 18px rgba(255, 138, 0, 0.35);
            transition: background-color .2s;
        }
        .fx-draw:hover { background: #FF9A1F; }
        .fx-draw.ready { animation: fx-pulse 1.4s ease-in-out infinite; }
        @keyframes fx-pulse {
            0%, 100% { box-shadow: 0 0 18px rgba(255, 138, 0, 0.55); }
            50% { box-shadow: 0 0 48px rgba(255, 138, 0, 0.9); }
        }

        /* 页脚 */
        .fx-footer { background: #000; border-top: 2px solid var(--accent); box-shadow: 0 -6px 30px var(--glow-soft); color: #8C8CA0; }

        @media (prefers-reduced-motion: reduce) {
            .fx-fill, .fx-draw, .fx-draw.ready, .hero > .deco, .fx-prize { animation: none; }
            #confetti { display: none; }
        }

        /* 每行格数：电脑 / 大屏（LED）每行 50 格；手机、平板每行 20 格（50 格在窄屏上太小无法点选） */
        #gridContainer {
            --cols: 20;
            display: grid;
            grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
            gap: 2px;
            container-type: inline-size;
        }
        @media (min-width: 1024px) {
            #gridContainer { --cols: 50; gap: 4px; }
        }
        /* 格子里的数字 / 锁随格子大小等比缩放（格子宽约 100cqi / 格数） */
        #gridContainer .grid-cell { font-size: calc(43cqi / var(--cols)); border-radius: calc(12cqi / var(--cols)); }
        #gridContainer .lock-icon { font-size: calc(68cqi / var(--cols)); }

        /* 100格的专场（50、100赛地专场）：100格铺满与500格完全相同大小的区域，每格放大
           手机：10列×10行（500格为20列×25行）；电脑/大屏：20列×5行（500格为50列×10行） */
        .grid-wrap { container-type: inline-size; }
        body[data-grid="100"] #gridContainer {
            --cols: 10;
            grid-template-rows: repeat(10, minmax(0, 1fr));
            height: calc((100cqi - 38px) * 1.25 + 48px);   /* = 500格在手机上的总高度 */
        }
        body[data-grid="100"] #gridContainer .grid-cell { aspect-ratio: auto; height: auto; font-size: 5cqi; }
        body[data-grid="100"] #gridContainer .lock-icon { font-size: 7cqi; }
        @media (min-width: 1024px) {
            body[data-grid="100"] #gridContainer {
                --cols: 20;
                grid-template-rows: repeat(5, minmax(0, 1fr));
                height: calc((100cqi - 196px) / 5 + 36px); /* = 500格在电脑上的总高度 */
            }
            body[data-grid="100"] #gridContainer .grid-cell { font-size: 2.5cqi; }
            body[data-grid="100"] #gridContainer .lock-icon { font-size: 3.2cqi; }
        }

        /* ===== 版面节奏：间距和字号随屏幕高度伸缩 =====
           大屏 / LED：更宽松、字更大，版面上下饱满；小屏：自动收紧，仍能一屏放下 */
        .l-header { padding-top: clamp(10px, 3vh, 56px); padding-bottom: clamp(30px, 5.4vh, 100px); }
        .l-title { font-size: clamp(1.6rem, min(3.2vw, 5.2vh), 3.6rem); line-height: 1.15; }
        .l-tabs { margin-top: clamp(8px, 2.2vh, 28px); }
        .l-tabs { gap: clamp(6px, 0.8vw, 12px) !important; }
        .l-tabs .round-tab { font-size: clamp(0.95rem, 1.9vh, 1.35rem); padding: clamp(6px, 1vh, 12px) clamp(10px, calc(2vw - 8px), 32px); }
        .l-card-wrap { margin-top: calc(-1 * clamp(24px, 4.5vh, 64px)); }
        .l-card { padding: clamp(10px, 2.2vh, 36px) clamp(16px, 2vw, 40px); }
        .l-stat-label { font-size: clamp(0.8rem, 1.6vh, 1.15rem); }
        .l-stat-num { font-size: clamp(1.4rem, 3.8vh, 3rem); line-height: 1.2; }
        .l-progress { margin-top: clamp(8px, 2vh, 24px); height: clamp(8px, 1.2vh, 14px); }
        .l-progress-text { margin-top: clamp(4px, 1vh, 12px); font-size: clamp(0.8rem, 1.5vh, 1.1rem); }
        .l-main { padding-top: clamp(8px, 1.6vh, 40px); padding-bottom: clamp(8px, 1.6vh, 40px); }
        .l-legend { margin-bottom: clamp(8px, 1.8vh, 24px); }
        .l-legend h2 { font-size: clamp(1.05rem, 2.3vh, 1.75rem); }
        .l-legend-items { font-size: clamp(0.85rem, 1.7vh, 1.2rem); }
        .l-legend-items .swatch { width: 1.1em; height: 1.1em; }
        .l-draw { margin-top: clamp(10px, 2vh, 48px); padding-top: clamp(10px, 1.9vh, 26px); padding-bottom: clamp(10px, 1.9vh, 26px); font-size: clamp(1.1rem, 2.4vh, 1.9rem); }
        .l-footer { padding-top: clamp(6px, 1.2vh, 14px); padding-bottom: clamp(6px, 1.2vh, 14px); font-size: clamp(0.75rem, 1.4vh, 1rem); }
    </style>
    <style type="text/tailwindcss">
        @layer utilities {
            .grid-cell {
                @apply w-full aspect-square rounded-md flex flex-col items-center justify-center gap-0.5 cursor-pointer font-extrabold leading-none;
                transition: transform .12s, background-color .15s, box-shadow .15s;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col" data-round="100" data-grid="100">
    <!-- 全屏彩带（JS 生成纸片） -->
    <div id="confetti" aria-hidden="true"></div>

    <!-- 顶部区域：顶栏 + 数据卡片；两侧大插画叠在上层 -->
    <div class="hero">
    <img class="deco deco-left" src="images/gifts.svg" alt="" aria-hidden="true">
    <img class="deco deco-right" src="images/trophy.svg" alt="" aria-hidden="true">

    <!-- 头部：主色渐变 + 舞台放射光 -->
    <header class="fx-header">
        <div class="container mx-auto px-4 l-header text-center">
            <h1 class="l-title fx-title font-extrabold tracking-tight" data-i18n="title">100赛地 · 购物赢大奖</h1>
            <!-- 场次切换 -->
            <div class="l-tabs inline-flex gap-3" role="tablist" aria-label="选择场次">
                <button type="button" class="round-tab" data-round="50" role="tab"><span data-i18n="tab50">50赛地专场</span></button>
                <button type="button" class="round-tab active" data-round="100" role="tab"><span data-i18n="tab100">100赛地专场</span></button>
                <button type="button" class="round-tab" data-round="200" role="tab"><span data-i18n="tab200">200赛地专场</span></button>
            </div>
        </div>
        <!-- 中英文切换 / 编辑文字：放在右侧（奖杯左边），不占中间布局 -->
        <div class="tools">
            <button type="button" id="langBtn" class="tool-btn" title="中文 / English">EN</button>
            <button type="button" id="editBtn" class="tool-btn">✎ 编辑</button>
        </div>
    </header>

    <!-- 抽奖页（全屏，嵌入 lucky-draw；每个场次一个独立的抽奖页）

    <!-- 编辑模式：底部提示条 + 编辑弹窗 -->
    <div id="editBar" role="toolbar">

    <footer class="fx-footer l-footer text-center">
        <p><span class="fx-accent font-bold" data-i18n="footer1">100赛地购物赢大奖 · 官方活动平台</span>　<span data-i18n="footer2">加纳 · 阿克拉 | 依法合规运营</span></p>
    </footer>

    <script>
        // ============== 配置区 ==============
        const CONFIG = {
            // 总名额（每个场次）
            TOTAL_SLOTS: 500, // 默认名额（各专场可在下方 ROUNDS 里单独设置 slots）

            // 两个场次：单价、抽奖页地址、本地存储键名
            // 抽奖页为本地副本，基于开源项目 vitozyf/lucky-draw（MIT）；?round=100 让 100赛地专场的抽奖配置/结果单独保存
            ROUNDS: {
                200: { price: 200, drawUrl: 'lucky-draw/index.html#/', storageKey: 'shopwin_round_data_v2', color: '#FFCC00' },
                100: { price: 100, slots: 100, drawUrl: 'lucky-draw/index.html?round=100#/', storageKey: 'shopwin_round_data_100', color: '#FF9F1C' },
                50: { price: 50, slots: 100, drawUrl: 'lucky-draw/index.html?round=50#/', storageKey: 'shopwin_round_data_50', color: '#2BE07A' }
            },

            // 打开 / 刷新页面时固定进入的场次
            DEFAULT_ROUND: '100'
        };
        // ============== 配置区结束 ==============

        // 每个场次各自的锁定状态：sold = 已支付（持久保存），selected = 当前锁定
        const roundState = {};
        Object.keys(CONFIG.ROUNDS).forEach((r) => {
            roundState[r] = { sold: new Set(), selected: new Set() };
        });

        // 当前场次（soldSlots / selectedSlots 指向当前场次的集合）
        let currentRound = '100';
        let soldSlots = roundState[currentRound].sold;
        let selectedSlots = roundState[currentRound].selected;

        // DOM 元素
        const gridContainer = document.getElementById('gridContainer');
        const soldCountEl = document.getElementById('soldCount');
        const remainCountEl = document.getElementById('remainCount');
        const progressBarEl = document.getElementById('progressBar');
        const progressPercentEl = document.getElementById('progressPercent');
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');

        // ========== 数据持久化 ==========
        function loadData(round) {
            const stored = localStorage.getItem(CONFIG.ROUNDS[round].storageKey);
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    if (data.soldSlots && Array.isArray(data.soldSlots)) {
                        // 只保留在当前名额范围内的号码（名额数改小后，超出的旧号码自动忽略）
                        const max = CONFIG.ROUNDS[round].slots || CONFIG.TOTAL_SLOTS;
                        roundState[round].sold = new Set(data.soldSlots.filter((n) => n >= 1 && n <= max));
                        return true;
                    }
                } catch (e) {
                    console.error('数据解析失败', e);
                }
            }
            return false;
        }

        // ========== 生成格子 ==========
        // 当前专场的名额数
        function totalSlots(round) {
            return CONFIG.ROUNDS[round || currentRound].slots || CONFIG.TOTAL_SLOTS;
        }

        function initGrid() {
            gridContainer.innerHTML = '';
            for (let i = 1; i <= totalSlots(); i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell cell-available';
                cell.textContent = i;
                cell.dataset.id = i;
                gridContainer.appendChild(cell);
            }
            updateStats();
        }

        // ========== 中英文文案（{price} 会替换成当前专场单价） ==========
        const TEXTS = {
            zh: {
                docTitle: '{price}赛地 · 购物赢大奖 —官方活动平台',
                title: '{price}赛地 · 购物赢大奖',
                tab50: '50赛地专场',
                tab100: '100赛地专场',
                tab200: '200赛地专场',
                statTotal: '总名额',
                statSold: '已售出',
                statRemain: '剩余名额',
                progress: '本轮进度：',
                perSlot: '每格={price}赛地商品+1次抽奖资格',
                prizeLabel: '今日大奖：',
                prizeValue: '手机',
                legendAvail: '可选',
                legendLocked: '已锁定',
                selectAll: '全选',
                reset: '重置',
                draw: '开始抽奖',
                footer1: '{price}赛地购物赢大奖 · 官方活动平台',
                footer2: '加纳 · 阿克拉 | 依法合规运营',
                langBtn: 'EN',
                editBtn: '✎ 编辑',
                editDone: '✓ 完成',
                editHint: '点击虚线框内的文字即可修改，自动保存',
                editRestoreAll: '恢复默认',
                editItemDefault: '恢复此项',
                editCancel: '取消',
                editSave: '保存',
                confirmRestore: '确定把页面上所有修改过的文字恢复成默认？（中英文、两个专场全部恢复）',
                confirmReset1: '⚠️ 确定重置 {price}赛地专场？\n该专场所有锁定将清空且不可恢复！',
                confirmReset2: '再次确认：开启全新一轮？'
            },
            en: {
                docTitle: '{price} Cedis · Shop & Win Big — Official Event Platform',
                title: '{price} Cedis · Shop & Win Big',
                tab50: '50 Cedis Special',
                tab100: '100 Cedis Special',
                tab200: '200 Cedis Special',
                statTotal: 'Total Slots',
                statSold: 'Sold',
                statRemain: 'Remaining',
                progress: 'Progress: ',
                perSlot: 'Each slot = {price} Cedis goods + 1 draw entry',
                prizeLabel: "Today's Grand Prize: ",
                prizeValue: 'Smartphone',
                legendAvail: 'Available',
                legendLocked: 'Locked',
                selectAll: 'Select All',
                reset: 'Reset',
                draw: 'START DRAW',
                footer1: '{price} Cedis Shop & Win Big · Official Event Platform',
                footer2: 'Accra · Ghana | Licensed & Compliant',
                langBtn: '中文',
                editBtn: '✎ Edit',
                editDone: '✓ Done',
                editHint: 'Click any dashed text to edit — saved automatically',
                editRestoreAll: 'Restore defaults',
                editItemDefault: 'Restore this',
                editCancel: 'Cancel',
                editSave: 'Save',
                confirmRestore: 'Restore ALL edited texts to default? (both languages and both specials)',
                confirmReset1: '⚠️ Reset the {price} Cedis Special?\nAll locked slots will be cleared and cannot be recovered!',
                confirmReset2: 'Confirm again: start a brand-new round?'
            }
        };
        const LANG_KEY = 'shopwin_lang';
        const TEXT_KEY = 'shopwin_texts_v1'; // 编辑后的文字：{ "键|专场|语言": "文字" }

        let lang = 'zh';
        try { if (localStorage.getItem(LANG_KEY) === 'en') lang = 'en'; } catch (e) {}
        let overrides = {};
        try { overrides = JSON.parse(localStorage.getItem(TEXT_KEY) || '{}') || {}; } catch (e) {}
        function saveOverrides() { try { localStorage.setItem(TEXT_KEY, JSON.stringify(overrides)); } catch (e) {} }

        // 默认文案
        function T(key) {
            const s = (TEXTS[lang][key] != null ? TEXTS[lang][key] : TEXTS.zh[key]) || '';
            return s.split('{price}').join(String(CONFIG.ROUNDS[currentRound].price));
        }
        const overrideKey = (key) => `${key}|${currentRound}|${lang}`;
        // 页面上实际显示的文字：有编辑过的用编辑后的，否则用默认
        function textFor(key) {
            const o = overrides[overrideKey(key)];
            return o != null ? o : T(key);
        }

        const langBtn = document.getElementById('langBtn');
        const editBtn = document.getElementById('editBtn');

        function renderTexts() {
            document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
            document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = textFor(el.dataset.i18n); });
            document.title = T('docTitle');
            // 奖杯底座文字随语言切换（大奖 / PRIZE）
            const trophy = document.querySelector('.deco-right');
            const trophySrc = lang === 'en' ? 'images/trophy-en.svg' : 'images/trophy.svg';
            if (trophy.getAttribute('src') !== trophySrc) trophy.setAttribute('src', trophySrc);
            langBtn.textContent = T('langBtn');
            editBtn.textContent = editing ? T('editDone') : T('editBtn');
            editBtn.classList.toggle('on', editing);
            ['editHint', 'editRestoreAll', 'editItemDefault', 'editCancel', 'editSave'].forEach((id) => {
                document.getElementById(id).textContent = T(id);
            });
            document.getElementById('editDone').textContent = T('editDone');
        }

        // ========== 一键中英文切换 ==========
        function notifyFramesLang() {
            Object.values(drawFrames).forEach((f) => {
                if (f.contentWindow) f.contentWindow.postMessage({ type: 'lucky-draw:lang', lang }, '*');
            });
        }
        langBtn.addEventListener('click', () => {
            lang = lang === 'en' ? 'zh' : 'en';
            try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
            closeEditor();
            renderTexts();
            notifyFramesLang();
        });

        // ========== 编辑模式：点击虚线框文字 → 弹窗修改 → 保存到本浏览器 ==========
        let editing = false;
        let editingEl = null;
        const editPop = document.getElementById('editPop');
        const editText = document.getElementById('editText');

        function setEditing(on) {
            editing = on;
            document.body.classList.toggle('editing', on);
            if (!on) closeEditor();
            renderTexts();
        }
        editBtn.addEventListener('click', () => setEditing(!editing));
        document.getElementById('editDone').addEventListener('click', () => setEditing(false));
        document.getElementById('editRestoreAll').addEventListener('click', () => {
            if (!confirm(T('confirmRestore'))) return;
            overrides = {};
            saveOverrides();
            closeEditor();
            renderTexts();
        });

        function openEditor(el) {
            editingEl = el;
            editText.value = el.textContent;
            editPop.style.display = 'block';
            const r = el.getBoundingClientRect();
            const w = editPop.offsetWidth, h = editPop.offsetHeight;
            let top = r.bottom + 10;
            if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 10);
            const left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
            editPop.style.top = top + 'px';
            editPop.style.left = left + 'px';
            editText.focus();
            editText.select();
        }
        function closeEditor() {
            editingEl = null;
            editPop.style.display = 'none';
        }
        function saveEditor() {
            if (!editingEl) return;
            const key = editingEl.dataset.i18n;
            const val = editText.value.replace(/\s*\n\s*/g, ' ').trim();
            if (!val || val === T(key)) delete overrides[overrideKey(key)];
            else overrides[overrideKey(key)] = val;
            saveOverrides();
            closeEditor();
            renderTexts();
        }
        document.getElementById('editSave').addEventListener('click', saveEditor);
        document.getElementById('editCancel').addEventListener('click', closeEditor);
        document.getElementById('editItemDefault').addEventListener('click', () => {
            if (!editingEl) return;
            delete overrides[overrideKey(editingEl.dataset.i18n)];
            saveOverrides();
            closeEditor();
            renderTexts();
        });
        editText.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEditor(); }
            if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }
        });
        // 编辑模式下拦截点击：点到可编辑文字就打开弹窗，其它按钮（切换专场、全选、抽奖等）暂不响应
        document.addEventListener('click', (e) => {
            if (!editing) return;
            if (e.target.closest('#editBar, #editPop, #editBtn, #langBtn')) return;
            e.preventDefault();
            e.stopPropagation();
            const el = e.target.closest('[data-i18n]');
            if (el) openEditor(el); else closeEditor();
        }, true);

        // ========== 场次切换 ==========
        function switchRound(round) {
            if (!CONFIG.ROUNDS[round]) round = '100';
            currentRound = round;
            soldSlots = roundState[round].sold;
            selectedSlots = roundState[round].selected;
            unlockTap = { id: null, count: 0, last: 0 };

            document.body.dataset.round = round;
            document.body.dataset.grid = totalSlots(round); // 100格的专场使用放大格子排法
            document.querySelectorAll('.round-tab').forEach((tab) => {
                const active = tab.dataset.round === round;
                tab.classList.toggle('active', active);
                tab.setAttribute('aria-selected', active);
            });
            themeColorMeta.setAttribute('content', CONFIG.ROUNDS[round].color);
            renderTexts(); // 标题、说明、今日大奖等文字随专场更新

            if (gridContainer.children.length !== totalSlots()) initGrid(); // 名额数不同（50专场100格）时重建格子
            refresh();
        }

        document.querySelectorAll('.round-tab').forEach((tab) => {
            tab.addEventListener('click', () => switchRound(tab.dataset.round));
        });

        // ========== 锁定/解锁（点击一次锁定，连续点按3次才解锁，防误碰） ==========
        const UNLOCK_TAPS = 3;          // 解锁所需连续点按次数
        const UNLOCK_WINDOW_MS = 800;   // 两次点按最大间隔，超时重新计数
        let unlockTap = { id: null, count: 0, last: 0 };

        function isLocked(id) {
            return soldSlots.has(id) || selectedSlots.has(id);
        }

        // 锁定一个可选格子，返回是否有变化
        function lockCell(id) {
            if (isLocked(id)) return false;
            selectedSlots.add(id);
            return true;
        }

        // 在已锁定格子上点按：连续3次才解锁
        function tapLockedCell(id) {
            if (soldSlots.has(id)) return false; // 已支付的名额不能解锁
            const now = Date.now();
            const continuing = unlockTap.id === id && now - unlockTap.last <= UNLOCK_WINDOW_MS;
            unlockTap = { id, count: continuing ? unlockTap.count + 1 : 1, last: now };
            if (unlockTap.count < UNLOCK_TAPS) return false;
            selectedSlots.delete(id);
            unlockTap = { id: null, count: 0, last: 0 };
            return true;
        }

        function refresh() {
            renderCells();
            updateStats();
        }

        // ========== 按住拖拽连续锁定（鼠标 / 触屏通用） ==========
        let dragging = false;
        let lastPoint = null;

        // 沿上一个点到当前点的路径逐段取样，快速拖动时也不会漏掉中间的格子
        function lockAlongPath(x, y) {
            let changed = false;
            const from = lastPoint || { x, y };
            const step = 6; // 取样间距（像素），小于格子尺寸
            const n = Math.max(1, Math.ceil(Math.hypot(x - from.x, y - from.y) / step));
            for (let k = 1; k <= n; k++) {
                const id = cellIdAt(from.x + (x - from.x) * k / n, from.y + (y - from.y) * k / n);
                if (id !== null && lockCell(id)) changed = true;
            }
            lastPoint = { x, y };
            return changed;
        }

        function cellIdAt(x, y) {
            const el = document.elementFromPoint(x, y);
            const cell = el && el.closest('#gridContainer .grid-cell');
            return cell ? parseInt(cell.dataset.id) : null;
        }

        gridContainer.addEventListener('pointerdown', (e) => {
            if (editing) return; // 编辑模式下不锁定格子
            const id = cellIdAt(e.clientX, e.clientY);
            if (id === null) return;
            e.preventDefault();
            if (isLocked(id)) {
                // 按在已锁定格子上：只做解锁计数，不开始拖拽
                if (tapLockedCell(id)) refresh();
                return;
            }
            unlockTap = { id: null, count: 0, last: 0 };
            dragging = true;
            lastPoint = { x: e.clientX, y: e.clientY };
            // 触屏下释放指针捕获，拖动时才能命中其它格子
            if (gridContainer.hasPointerCapture(e.pointerId)) gridContainer.releasePointerCapture(e.pointerId);
            if (lockCell(id)) refresh();
        });

        document.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            if (lockAlongPath(e.clientX, e.clientY)) refresh();
        });

        const stopDrag = () => { dragging = false; lastPoint = null; };
        document.addEventListener('pointerup', stopDrag);
        document.addEventListener('pointercancel', stopDrag);

        // ========== 全选（测试用）：一键锁定当前场次全部格子 ==========
        document.getElementById('selectAllBtn').addEventListener('click', () => {
            for (let i = 1; i <= totalSlots(); i++) lockCell(i);
            refresh();
        });

        // ========== 开始抽奖：当前场次500格全部锁定才进入，否则无反应 ==========
        const drawView = document.getElementById('drawView');
        const drawFrames = {
            200: document.getElementById('drawFrame200'),
            100: document.getElementById('drawFrame100'),
            50: document.getElementById('drawFrame50')
        };

        function allLocked() {
            return soldSlots.size + selectedSlots.size >= totalSlots();
        }

        let openRound = null; // 当前显示中的抽奖页场次；null 表示抽奖页未打开

        // 抽奖页地址还没设置就设置（开始加载）
        function ensureFrameLoaded(round) {
            const frame = drawFrames[round];
            if (!frame.getAttribute('src')) frame.src = CONFIG.ROUNDS[round].drawUrl;
        }

        // 通知抽奖页：显示中（3D球转动、播放音乐）或已隐藏（暂停）
        function tellFrame(round) {
            const w = drawFrames[round].contentWindow;
            if (!w) return;
            w.postMessage({ type: 'lucky-draw:lang', lang }, '*'); // 同步中英文
            w.postMessage({ type: openRound === round ? 'lucky-draw:show' : 'lucky-draw:hide' }, '*');
        }

        function openDraw(round) {
            ensureFrameLoaded(round);
            openRound = round;
            Object.entries(drawFrames).forEach(([r, f]) => f.classList.toggle('invisible', r !== round));
            drawView.classList.remove('invisible', 'pointer-events-none');
            document.body.style.overflow = 'hidden';
            tellFrame(round);
        }

        function closeDraw() {
            const round = openRound;
            openRound = null;
            Object.values(drawFrames).forEach((f) => f.classList.add('invisible'));
            drawView.classList.add('invisible', 'pointer-events-none');
            document.body.style.overflow = '';
            if (round) tellFrame(round);
        }

        document.getElementById('drawBtn').addEventListener('click', () => {
            if (!allLocked()) return;
            openDraw(currentRound);
        });

        window.addEventListener('message', (e) => {
            const entry = Object.entries(drawFrames).find(([, f]) => f.contentWindow === e.source);
            if (!entry || !e.data) return;
            const round = entry[0];
            // 抽奖页加载完成后询问自己当前是否应显示（预加载时为隐藏）
            if (e.data.type === 'lucky-draw:ready') tellFrame(round);
            // 抽奖页顶栏的"返回"按钮
            if (e.data.type === 'lucky-draw:back' && openRound === round) closeDraw();
        });

        // 预加载：页面打开 1 秒后在后台依次加载各专场的抽奖页（当前专场优先），点"开始抽奖"时无需等待
        window.addEventListener('load', () => {
            const order = [currentRound].concat(Object.keys(drawFrames).filter((r) => r !== currentRound));
            order.forEach((r, i) => setTimeout(() => ensureFrameLoaded(r), 1000 + i * 1500));
        });

        // ========== 渲染格子状态 ==========
        function renderCells() {
            for (let i = 1; i <= totalSlots(); i++) {
                const cell = gridContainer.querySelector(`[data-id="${i}"]`);
                cell.className = 'grid-cell';
                if (soldSlots.has(i) || selectedSlots.has(i)) {
                    cell.classList.add('cell-locked');
                    cell.innerHTML = `<i class="fa fa-lock lock-icon"></i>`;
                } else {
                    cell.classList.add('cell-available');
                    cell.textContent = i;
                }
            }
        }

        // ========== 更新统计数据 ==========
        function updateStats() {
            // 锁定即售出：已售出 = 已支付 + 当前锁定
            const sold = soldSlots.size + selectedSlots.size;
            const total = totalSlots();
            const remain = total - sold;
            const percent = Math.round((sold / total) * 100);

            document.getElementById('totalCount').textContent = total;

            soldCountEl.textContent = sold;
            remainCountEl.textContent = remain;
            progressBarEl.style.width = `${percent}%`;
            progressPercentEl.textContent = percent;
            // 500格全部锁定：开始抽奖按钮变亮并呼吸闪光
            document.getElementById('drawBtn').classList.toggle('ready', remain <= 0);
        }

        // ========== 重置（只作用于当前专场，需二次确认） ==========
        document.getElementById('resetRoundBtn').addEventListener('click', () => {
            const price = CONFIG.ROUNDS[currentRound].price;
            if (!confirm(T('confirmReset1'))) return;
            if (!confirm(T('confirmReset2'))) return;

            soldSlots.clear();
            selectedSlots.clear();
            localStorage.removeItem(CONFIG.ROUNDS[currentRound].storageKey);
            refresh();
        });

        // ========== 全屏彩带：加纳国旗色纸片（红、金、绿）+ 当前专场主色 ==========
        (function makeConfetti() {
            const box = document.getElementById('confetti');
            const colors = ['#CE1126', '#FCD116', '#006B3F', 'var(--accent)', '#FFFFFF'];
            const count = window.innerWidth < 768 ? 18 : 42;
            const rand = (a, b) => a + Math.random() * (b - a);
            for (let i = 0; i < count; i++) {
                const p = document.createElement('i');
                const w = rand(6, 12);
                p.style.left = rand(0, 100) + 'vw';
                p.style.width = w + 'px';
                p.style.height = w * rand(0.4, 1.6) + 'px';
                p.style.background = colors[i % colors.length];
                p.style.animationDuration = rand(7, 16) + 's';
                p.style.animationDelay = -rand(0, 16) + 's';
                p.style.setProperty('--drift', rand(-12, 12) + 'vw');
                p.style.setProperty('--spin', rand(-720, 720) + 'deg');
                box.appendChild(p);
            }
        })();

        // PWA：注册 Service Worker（需通过 https 或 localhost 访问；双击本地文件打开时自动跳过）
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Service Worker 注册失败', e));
            });

            // 网站有新版本并接管后，自动刷新一次换成新版（不用手动刷新两次）
            // 为了不打扰正在进行的活动：有锁定的名额或抽奖页开着时不自动刷新，等下次打开再更新
            const hadController = !!navigator.serviceWorker.controller; // 首次访问不刷新
            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!hadController || reloading) return;
                const busy = openRound !== null ||
                    Object.values(roundState).some((s) => s.selected.size > 0 || s.sold.size > 0);
                if (busy) return;
                reloading = true;
                location.reload();
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initGrid();
            Object.keys(CONFIG.ROUNDS).forEach(loadData);
            // 每次打开 / 刷新都进入 100赛地专场
            try { localStorage.removeItem('shopwin_current_round'); } catch (e) {} // 清掉旧版本记住的场次
            switchRound(CONFIG.DEFAULT_ROUND);
        });
    </script>
</body>
</html>
