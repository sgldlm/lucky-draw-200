<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100赛地 · 购物赢大奖 —官方活动平台</title>
    <!-- PWA：可安装到手机桌面 / 电脑，支持离线打开 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF9F1C">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="赢大奖">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // 旧版浅色配色（页面现使用下方 <style> 中的深色舞台 + 主色发光设计）
                        momo: {
                            accent: 'var(--accent)', // 场次主色：200赛地专场 MoMo 黄，100赛地专场 橙色
                            ink: '#111111',          // 主文字 / 黑色按钮
                            gray: '#5F5F5F',         // 次要文字
                            line: '#E3E3E3',         // 分隔线 / 进度条底
                            bg: '#F4F4F4',           // 页面底色
                            locked: '#3A3A3A',       // 已锁定格子（深灰）
                            red: '#C62828'           // 危险操作
                        }
                    },
                    fontFamily: {
                        sans: ['system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* ===== 两个专场的配色（户外大屏：深色舞台底 + 高饱和主色发光） =====
           --accent 主色；--accent-hi 高光色；--accent-lo 深色端；--glow 光晕 */
        :root {
            --accent: #FFCC00; --accent-hi: #FFF06A; --accent-lo: #FF8A00;
            --glow: rgba(255, 204, 0, 0.55); --glow-soft: rgba(255, 204, 0, 0.18);
            --stage: #07070C;
        }
        body[data-round="100"] {
            --accent: #FF9F1C; --accent-hi: #FFD36B; --accent-lo: #FF3D00;
            --glow: rgba(255, 110, 20, 0.6); --glow-soft: rgba(255, 110, 20, 0.2);
        }

        /* 页面底：深色舞台 + 主色柔光 */
        body { background-color: var(--stage); color: #fff; }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background:
                radial-gradient(ellipse 70% 45% at 50% 0%, var(--glow-soft), transparent 70%),
                radial-gradient(ellipse 45% 40% at 0% 100%, var(--glow-soft), transparent 70%),
                radial-gradient(ellipse 45% 40% at 100% 100%, var(--glow-soft), transparent 70%),
                radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1.2px) 0 0 / 22px 22px,
                var(--stage);
        }

        /* 顶栏：主色渐变 + 舞台放射光 */
        .fx-header {
            position: relative; overflow: hidden;
            background: linear-gradient(115deg, var(--accent-hi) 0%, var(--accent) 45%, var(--accent-lo) 100%);
            box-shadow: 0 10px 50px var(--glow);
        }
        .fx-header::before {
            content: ""; position: absolute; inset: -50% -10% 0; pointer-events: none;
            background: repeating-conic-gradient(from 0deg at 50% 100%, rgba(255, 255, 255, 0.22) 0deg 5deg, transparent 5deg 12deg);
            -webkit-mask-image: radial-gradient(ellipse 60% 90% at 50% 100%, #000 30%, transparent 75%);
                    mask-image: radial-gradient(ellipse 60% 90% at 50% 100%, #000 30%, transparent 75%);
        }
        .fx-header > * { position: relative; }
        .fx-title { color: #111; text-shadow: 0 2px 0 rgba(255, 255, 255, 0.5), 0 6px 18px rgba(0, 0, 0, 0.18); letter-spacing: 0.02em; }

        /* 专场切换 */
        .round-tab {
            border-radius: 9999px; font-weight: 800; color: #111;
            border: 2px solid #111; background: rgba(255, 255, 255, 0.25);
            transition: background-color .2s, color .2s, box-shadow .2s;
        }
        .round-tab:hover { background: rgba(255, 255, 255, 0.45); }
        .round-tab.active { background: #111; color: var(--accent); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); }

        /* 数据卡：深色发光玻璃 */
        .fx-card {
            background: linear-gradient(180deg, rgba(34, 34, 46, 0.94), rgba(14, 14, 20, 0.96));
            border: 1px solid var(--accent);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04) inset, 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 40px var(--glow-soft);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        }
        .fx-stat-label { color: #B9B9CC; letter-spacing: 0.08em; }
        .fx-stat-num { color: #fff; text-shadow: 0 0 18px rgba(255, 255, 255, 0.25); }
        .fx-stat-num.hot {
            background: linear-gradient(180deg, var(--accent-hi), var(--accent) 60%, var(--accent-lo));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-shadow: none; filter: drop-shadow(0 0 12px var(--glow));
        }
        .fx-divide > * + * { border-left: 1px solid rgba(255, 255, 255, 0.12); }
        .fx-track { background: rgba(255, 255, 255, 0.1); box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6); }
        .fx-fill {
            background:
                repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.28) 0 10px, transparent 10px 22px),
                linear-gradient(90deg, var(--accent-lo), var(--accent), var(--accent-hi));
            background-size: 44px 100%, 100% 100%;
            box-shadow: 0 0 14px var(--glow);
            animation: fx-flow 1.2s linear infinite;
        }
        @keyframes fx-flow { to { background-position: 44px 0, 0 0; } }
        .fx-muted { color: #A6A6B8; }
        .fx-accent { color: var(--accent); }

        /* 图例 */
        .fx-legend-title { color: #fff; }
        .fx-legend-items { color: #D4D4E0; }
        .fx-btn-all { background: linear-gradient(180deg, var(--accent-hi), var(--accent)); color: #111; font-weight: 700; box-shadow: 0 0 14px var(--glow-soft); }
        .fx-btn-reset { border: 1px solid #FF6B6B; color: #FF8A8A; background: rgba(255, 80, 80, 0.08); }
        .fx-btn-reset:hover { background: #E53935; color: #fff; border-color: #E53935; }

        /* 格子：立体按钮质感 */
        .cell-available {
            background: linear-gradient(160deg, var(--accent-hi) 0%, var(--accent) 50%, var(--accent-lo) 100%);
            color: #111;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), inset 0 -2px 0 rgba(0, 0, 0, 0.22);
        }
        .cell-available:hover {
            background: #fff; color: #111; position: relative; z-index: 2;
            transform: scale(1.18); box-shadow: 0 0 18px var(--glow), 0 0 0 2px var(--accent);
        }
        .cell-locked {
            background: linear-gradient(160deg, #474755 0%, #2A2A34 60%, #1E1E26 100%);
            color: rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 -2px 0 rgba(0, 0, 0, 0.45);
        }
        .swatch-available { background: linear-gradient(160deg, var(--accent-hi), var(--accent) 50%, var(--accent-lo)); }
        .swatch-locked { background: linear-gradient(160deg, #474755, #1E1E26); color: #fff; }

        /* 开始抽奖：纯橙色按钮；500格全部锁定后外圈呼吸闪光 */
        .fx-draw {
            color: #111; font-weight: 900; letter-spacing: 0.35em; text-indent: 0.35em;
            background: #FF8A00;
            box-shadow: 0 0 18px rgba(255, 138, 0, 0.35);
            transition: background-color .2s;
        }
        .fx-draw:hover { background: #FF9A1F; }
        .fx-draw.ready { animation: fx-pulse 1.4s ease-in-out infinite; }
        @keyframes fx-pulse {
            0%, 100% { box-shadow: 0 0 18px rgba(255, 138, 0, 0.55); }
            50% { box-shadow: 0 0 48px rgba(255, 138, 0, 0.9); }
        }

        /* 页脚 */
        .fx-footer { background: #000; border-top: 2px solid var(--accent); box-shadow: 0 -6px 30px var(--glow-soft); color: #8C8CA0; }

        @media (prefers-reduced-motion: reduce) {
            .fx-fill, .fx-draw, .fx-draw.ready { animation: none; }
        }

        /* 每行格数：电脑 / 大屏（LED）每行 50 格；手机、平板每行 20 格（50 格在窄屏上太小无法点选） */
        #gridContainer {
            --cols: 20;
            display: grid;
            grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
            gap: 2px;
            container-type: inline-size;
        }
        @media (min-width: 1024px) {
            #gridContainer { --cols: 50; gap: 4px; }
        }
        /* 格子里的数字 / 锁随格子大小等比缩放（格子宽约 100cqi / 格数） */
        #gridContainer .grid-cell { font-size: calc(43cqi / var(--cols)); border-radius: calc(12cqi / var(--cols)); }
        #gridContainer .lock-icon { font-size: calc(68cqi / var(--cols)); }

        /* ===== 版面节奏：间距和字号随屏幕高度伸缩 =====
           大屏 / LED：更宽松、字更大，版面上下饱满；小屏：自动收紧，仍能一屏放下 */
        .l-header { padding-top: clamp(10px, 3vh, 56px); padding-bottom: clamp(30px, 5.4vh, 100px); }
        .l-title { font-size: clamp(1.6rem, min(3.2vw, 5.2vh), 3.6rem); line-height: 1.15; }
        .l-tabs { margin-top: clamp(8px, 2.2vh, 28px); }
        .l-tabs .round-tab { font-size: clamp(0.95rem, 1.9vh, 1.35rem); padding: clamp(6px, 1vh, 12px) clamp(18px, 2vw, 32px); }
        .l-card-wrap { margin-top: calc(-1 * clamp(24px, 4.5vh, 64px)); }
        .l-card { padding: clamp(10px, 2.2vh, 36px) clamp(16px, 2vw, 40px); }
        .l-stat-label { font-size: clamp(0.8rem, 1.6vh, 1.15rem); }
        .l-stat-num { font-size: clamp(1.4rem, 3.8vh, 3rem); line-height: 1.2; }
        .l-progress { margin-top: clamp(8px, 2vh, 24px); height: clamp(8px, 1.2vh, 14px); }
        .l-progress-text { margin-top: clamp(4px, 1vh, 12px); font-size: clamp(0.8rem, 1.5vh, 1.1rem); }
        .l-main { padding-top: clamp(8px, 1.6vh, 40px); padding-bottom: clamp(8px, 1.6vh, 40px); }
        .l-legend { margin-bottom: clamp(8px, 1.8vh, 24px); }
        .l-legend h2 { font-size: clamp(1.05rem, 2.3vh, 1.75rem); }
        .l-legend-items { font-size: clamp(0.85rem, 1.7vh, 1.2rem); }
        .l-legend-items .swatch { width: 1.1em; height: 1.1em; }
        .l-draw { margin-top: clamp(10px, 2vh, 48px); padding-top: clamp(10px, 1.9vh, 26px); padding-bottom: clamp(10px, 1.9vh, 26px); font-size: clamp(1.1rem, 2.4vh, 1.9rem); }
        .l-footer { padding-top: clamp(6px, 1.2vh, 14px); padding-bottom: clamp(6px, 1.2vh, 14px); font-size: clamp(0.75rem, 1.4vh, 1rem); }
    </style>
    <style type="text/tailwindcss">
        @layer utilities {
            .grid-cell {
                @apply w-full aspect-square rounded-md flex flex-col items-center justify-center gap-0.5 cursor-pointer font-extrabold leading-none;
                transition: transform .12s, background-color .15s, box-shadow .15s;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col" data-round="100">
    <!-- 头部：主色渐变 + 舞台放射光 -->
    <header class="fx-header">
        <div class="container mx-auto px-4 l-header text-center">
            <h1 class="l-title fx-title font-extrabold tracking-tight"><span class="js-price">100</span>赛地 · 购物赢大奖</h1>
            <!-- 场次切换 -->
            <div class="l-tabs inline-flex gap-3" role="tablist" aria-label="选择场次">
                <button type="button" class="round-tab active" data-round="100" role="tab">100赛地专场</button>
                <button type="button" class="round-tab" data-round="200" role="tab">200赛地专场</button>
            </div>
        </div>
    </header>

    <!-- 实时数据卡片（压在顶栏下沿）；内容宽度占屏幕 90%、左右留白，格子和文字随宽度等比缩放，方便大 LED 屏使用 -->
    <div class="w-[90%] mx-auto l-card-wrap">
        <div class="fx-card rounded-2xl l-card">
            <div class="grid grid-cols-3 text-center fx-divide">
                <div>
                    <p class="fx-stat-label l-stat-label">总名额</p>
                    <p class="l-stat-num fx-stat-num font-extrabold">500</p>
                </div>
                <div>
                    <p class="fx-stat-label l-stat-label">已售出</p>
                    <p id="soldCount" class="l-stat-num fx-stat-num hot font-extrabold">0</p>
                </div>
                <div>
                    <p class="fx-stat-label l-stat-label">剩余名额</p>
                    <p id="remainCount" class="l-stat-num fx-stat-num font-extrabold">500</p>
                </div>
            </div>
            <div class="l-progress fx-track rounded-full overflow-hidden">
                <div id="progressBar" class="fx-fill h-full rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p class="text-center l-progress-text fx-muted">本轮进度：<span id="progressPercent" class="font-bold fx-accent">0</span>%</p>
        </div>
    </div>

    <main class="w-[90%] mx-auto l-main flex-1 flex flex-col justify-center">
        <!-- 500格选号区 -->
        <section>
            <div class="l-legend flex items-center justify-between flex-wrap gap-x-6 gap-y-2">
                <h2 class="fx-legend-title font-extrabold">每格=<span class="js-price fx-accent">100</span>赛地商品+1次抽奖资格</h2>
                <div class="l-legend-items fx-legend-items flex items-center gap-4">
                    <span class="flex items-center gap-1"><span class="swatch swatch-available rounded"></span> 可选</span>
                    <span class="flex items-center gap-1"><span class="swatch swatch-locked rounded flex items-center justify-center"><i class="fa fa-lock" style="font-size:.65em"></i></span> 已锁定</span>
                    <!-- 测试用：一键锁定全部格子 -->
                    <button id="selectAllBtn" type="button" class="px-4 py-1 fx-btn-all rounded-full hover:opacity-90">全选</button>
                    <!-- 重置当前专场（清空本轮锁定数据，需二次确认） -->
                    <button id="resetRoundBtn" type="button" class="px-4 py-1 fx-btn-reset rounded-full">重置</button>
                </div>
            </div>

            <div id="gridContainer" class="select-none touch-none">
                <!-- JS 自动生成500格 -->
            </div>
        </section>

        <!-- 开始抽奖：500格全部锁定后才可进入抽奖（全部锁定时按钮变亮并呼吸闪光） -->
        <section>
            <button id="drawBtn" type="button" class="l-draw fx-draw w-full rounded-full">
                开始抽奖
            </button>
        </section>
    </main>

    <!-- 抽奖页（全屏，嵌入 lucky-draw；每个场次一个独立的抽奖页）
         页面打开后在后台预先加载（不可见、3D球暂停、不放音乐），点"开始抽奖"时立即显示 -->
    <div id="drawView" class="fixed inset-0 z-50 bg-black flex flex-col invisible pointer-events-none">
        <div class="h-1.5 shrink-0" style="background: linear-gradient(90deg, var(--accent-lo), var(--accent), var(--accent-hi))"></div>
        <!-- "返回"按钮在抽奖页顶栏内（lucky-draw/custom-music.js），点击后发消息关闭本层 -->
        <div class="relative flex-1">
            <iframe id="drawFrame200" data-round="200" title="200赛地专场抽奖" class="absolute inset-0 w-full h-full border-0 invisible" allow="fullscreen; autoplay"></iframe>
            <iframe id="drawFrame100" data-round="100" title="100赛地专场抽奖" class="absolute inset-0 w-full h-full border-0 invisible" allow="fullscreen; autoplay"></iframe>
        </div>
    </div>

    <footer class="fx-footer l-footer text-center">
        <p><span class="fx-accent font-bold"><span class="js-price">100</span>赛地购物赢大奖 · 官方活动平台</span>　加纳 · 阿克拉 | 依法合规运营</p>
    </footer>

    <script>
        // ============== 配置区 ==============
        const CONFIG = {
            // 总名额（每个场次）
            TOTAL_SLOTS: 500,

            // 两个场次：单价、抽奖页地址、本地存储键名
            // 抽奖页为本地副本，基于开源项目 vitozyf/lucky-draw（MIT）；?round=100 让 100赛地专场的抽奖配置/结果单独保存
            ROUNDS: {
                200: { price: 200, drawUrl: 'lucky-draw/index.html#/', storageKey: 'shopwin_round_data_v2', color: '#FFCC00' },
                100: { price: 100, drawUrl: 'lucky-draw/index.html?round=100#/', storageKey: 'shopwin_round_data_100', color: '#FF9F1C' }
            },

            // 打开 / 刷新页面时固定进入的场次
            DEFAULT_ROUND: '100'
        };
        // ============== 配置区结束 ==============

        // 每个场次各自的锁定状态：sold = 已支付（持久保存），selected = 当前锁定
        const roundState = {};
        Object.keys(CONFIG.ROUNDS).forEach((r) => {
            roundState[r] = { sold: new Set(), selected: new Set() };
        });

        // 当前场次（soldSlots / selectedSlots 指向当前场次的集合）
        let currentRound = '100';
        let soldSlots = roundState[currentRound].sold;
        let selectedSlots = roundState[currentRound].selected;

        // DOM 元素
        const gridContainer = document.getElementById('gridContainer');
        const soldCountEl = document.getElementById('soldCount');
        const remainCountEl = document.getElementById('remainCount');
        const progressBarEl = document.getElementById('progressBar');
        const progressPercentEl = document.getElementById('progressPercent');
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');

        // ========== 数据持久化 ==========
        function loadData(round) {
            const stored = localStorage.getItem(CONFIG.ROUNDS[round].storageKey);
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    if (data.soldSlots && Array.isArray(data.soldSlots)) {
                        roundState[round].sold = new Set(data.soldSlots);
                        return true;
                    }
                } catch (e) {
                    console.error('数据解析失败', e);
                }
            }
            return false;
        }

        // ========== 生成格子 ==========
        function initGrid() {
            gridContainer.innerHTML = '';
            for (let i = 1; i <= CONFIG.TOTAL_SLOTS; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell cell-available';
                cell.textContent = i;
                cell.dataset.id = i;
                gridContainer.appendChild(cell);
            }
            updateStats();
        }

        // ========== 场次切换 ==========
        function switchRound(round) {
            if (!CONFIG.ROUNDS[round]) round = '100';
            currentRound = round;
            soldSlots = roundState[round].sold;
            selectedSlots = roundState[round].selected;
            unlockTap = { id: null, count: 0, last: 0 };

            const price = CONFIG.ROUNDS[round].price;
            document.body.dataset.round = round;
            document.querySelectorAll('.js-price').forEach((el) => { el.textContent = price; });
            document.querySelectorAll('.round-tab').forEach((tab) => {
                const active = tab.dataset.round === round;
                tab.classList.toggle('active', active);
                tab.setAttribute('aria-selected', active);
            });
            document.title = `${price}赛地 · 购物赢大奖 —官方活动平台`;
            themeColorMeta.setAttribute('content', CONFIG.ROUNDS[round].color);

            refresh();
        }

        document.querySelectorAll('.round-tab').forEach((tab) => {
            tab.addEventListener('click', () => switchRound(tab.dataset.round));
        });

        // ========== 锁定/解锁（点击一次锁定，连续点按3次才解锁，防误碰） ==========
        const UNLOCK_TAPS = 3;          // 解锁所需连续点按次数
        const UNLOCK_WINDOW_MS = 800;   // 两次点按最大间隔，超时重新计数
        let unlockTap = { id: null, count: 0, last: 0 };

        function isLocked(id) {
            return soldSlots.has(id) || selectedSlots.has(id);
        }

        // 锁定一个可选格子，返回是否有变化
        function lockCell(id) {
            if (isLocked(id)) return false;
            selectedSlots.add(id);
            return true;
        }

        // 在已锁定格子上点按：连续3次才解锁
        function tapLockedCell(id) {
            if (soldSlots.has(id)) return false; // 已支付的名额不能解锁
            const now = Date.now();
            const continuing = unlockTap.id === id && now - unlockTap.last <= UNLOCK_WINDOW_MS;
            unlockTap = { id, count: continuing ? unlockTap.count + 1 : 1, last: now };
            if (unlockTap.count < UNLOCK_TAPS) return false;
            selectedSlots.delete(id);
            unlockTap = { id: null, count: 0, last: 0 };
            return true;
        }

        function refresh() {
            renderCells();
            updateStats();
        }

        // ========== 按住拖拽连续锁定（鼠标 / 触屏通用） ==========
        let dragging = false;
        let lastPoint = null;

        // 沿上一个点到当前点的路径逐段取样，快速拖动时也不会漏掉中间的格子
        function lockAlongPath(x, y) {
            let changed = false;
            const from = lastPoint || { x, y };
            const step = 6; // 取样间距（像素），小于格子尺寸
            const n = Math.max(1, Math.ceil(Math.hypot(x - from.x, y - from.y) / step));
            for (let k = 1; k <= n; k++) {
                const id = cellIdAt(from.x + (x - from.x) * k / n, from.y + (y - from.y) * k / n);
                if (id !== null && lockCell(id)) changed = true;
            }
            lastPoint = { x, y };
            return changed;
        }

        function cellIdAt(x, y) {
            const el = document.elementFromPoint(x, y);
            const cell = el && el.closest('#gridContainer .grid-cell');
            return cell ? parseInt(cell.dataset.id) : null;
        }

        gridContainer.addEventListener('pointerdown', (e) => {
            const id = cellIdAt(e.clientX, e.clientY);
            if (id === null) return;
            e.preventDefault();
            if (isLocked(id)) {
                // 按在已锁定格子上：只做解锁计数，不开始拖拽
                if (tapLockedCell(id)) refresh();
                return;
            }
            unlockTap = { id: null, count: 0, last: 0 };
            dragging = true;
            lastPoint = { x: e.clientX, y: e.clientY };
            // 触屏下释放指针捕获，拖动时才能命中其它格子
            if (gridContainer.hasPointerCapture(e.pointerId)) gridContainer.releasePointerCapture(e.pointerId);
            if (lockCell(id)) refresh();
        });

        document.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            if (lockAlongPath(e.clientX, e.clientY)) refresh();
        });

        const stopDrag = () => { dragging = false; lastPoint = null; };
        document.addEventListener('pointerup', stopDrag);
        document.addEventListener('pointercancel', stopDrag);

        // ========== 全选（测试用）：一键锁定当前场次全部格子 ==========
        document.getElementById('selectAllBtn').addEventListener('click', () => {
            for (let i = 1; i <= CONFIG.TOTAL_SLOTS; i++) lockCell(i);
            refresh();
        });

        // ========== 开始抽奖：当前场次500格全部锁定才进入，否则无反应 ==========
        const drawView = document.getElementById('drawView');
        const drawFrames = {
            200: document.getElementById('drawFrame200'),
            100: document.getElementById('drawFrame100')
        };

        function allLocked() {
            return soldSlots.size + selectedSlots.size >= CONFIG.TOTAL_SLOTS;
        }

        let openRound = null; // 当前显示中的抽奖页场次；null 表示抽奖页未打开

        // 抽奖页地址还没设置就设置（开始加载）
        function ensureFrameLoaded(round) {
            const frame = drawFrames[round];
            if (!frame.getAttribute('src')) frame.src = CONFIG.ROUNDS[round].drawUrl;
        }

        // 通知抽奖页：显示中（3D球转动、播放音乐）或已隐藏（暂停）
        function tellFrame(round) {
            const w = drawFrames[round].contentWindow;
            if (w) w.postMessage({ type: openRound === round ? 'lucky-draw:show' : 'lucky-draw:hide' }, '*');
        }

        function openDraw(round) {
            ensureFrameLoaded(round);
            openRound = round;
            Object.entries(drawFrames).forEach(([r, f]) => f.classList.toggle('invisible', r !== round));
            drawView.classList.remove('invisible', 'pointer-events-none');
            document.body.style.overflow = 'hidden';
            tellFrame(round);
        }

        function closeDraw() {
            const round = openRound;
            openRound = null;
            Object.values(drawFrames).forEach((f) => f.classList.add('invisible'));
            drawView.classList.add('invisible', 'pointer-events-none');
            document.body.style.overflow = '';
            if (round) tellFrame(round);
        }

        document.getElementById('drawBtn').addEventListener('click', () => {
            if (!allLocked()) return;
            openDraw(currentRound);
        });

        window.addEventListener('message', (e) => {
            const entry = Object.entries(drawFrames).find(([, f]) => f.contentWindow === e.source);
            if (!entry || !e.data) return;
            const round = entry[0];
            // 抽奖页加载完成后询问自己当前是否应显示（预加载时为隐藏）
            if (e.data.type === 'lucky-draw:ready') tellFrame(round);
            // 抽奖页顶栏的"返回"按钮
            if (e.data.type === 'lucky-draw:back' && openRound === round) closeDraw();
        });

        // 预加载：页面打开 1 秒后在后台加载两个专场的抽奖页，点"开始抽奖"时无需等待
        window.addEventListener('load', () => {
            setTimeout(() => {
                ensureFrameLoaded(currentRound);
                const other = Object.keys(drawFrames).find((r) => r !== currentRound);
                setTimeout(() => ensureFrameLoaded(other), 1500);
            }, 1000);
        });

        // ========== 渲染格子状态 ==========
        function renderCells() {
            for (let i = 1; i <= CONFIG.TOTAL_SLOTS; i++) {
                const cell = gridContainer.querySelector(`[data-id="${i}"]`);
                cell.className = 'grid-cell';
                if (soldSlots.has(i) || selectedSlots.has(i)) {
                    cell.classList.add('cell-locked');
                    cell.innerHTML = `<i class="fa fa-lock lock-icon"></i>`;
                } else {
                    cell.classList.add('cell-available');
                    cell.textContent = i;
                }
            }
        }

        // ========== 更新统计数据 ==========
        function updateStats() {
            // 锁定即售出：已售出 = 已支付 + 当前锁定
            const sold = soldSlots.size + selectedSlots.size;
            const remain = CONFIG.TOTAL_SLOTS - sold;
            const percent = Math.round((sold / CONFIG.TOTAL_SLOTS) * 100);

            soldCountEl.textContent = sold;
            remainCountEl.textContent = remain;
            progressBarEl.style.width = `${percent}%`;
            progressPercentEl.textContent = percent;
            // 500格全部锁定：开始抽奖按钮变亮并呼吸闪光
            document.getElementById('drawBtn').classList.toggle('ready', remain <= 0);
        }

        // ========== 重置（只作用于当前专场，需二次确认） ==========
        document.getElementById('resetRoundBtn').addEventListener('click', () => {
            const price = CONFIG.ROUNDS[currentRound].price;
            if (!confirm(`⚠️ 确定重置 ${price}赛地专场？\n该专场所有锁定将清空且不可恢复！`)) return;
            if (!confirm('再次确认：开启全新一轮？')) return;

            soldSlots.clear();
            selectedSlots.clear();
            localStorage.removeItem(CONFIG.ROUNDS[currentRound].storageKey);
            refresh();
        });

        // PWA：注册 Service Worker（需通过 https 或 localhost 访问；双击本地文件打开时自动跳过）
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Service Worker 注册失败', e));
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initGrid();
            Object.keys(CONFIG.ROUNDS).forEach(loadData);
            // 每次打开 / 刷新都进入 100赛地专场
            try { localStorage.removeItem('shopwin_current_round'); } catch (e) {} // 清掉旧版本记住的场次
            switchRound(CONFIG.DEFAULT_ROUND);
        });
    </script>
</body>
</html>
